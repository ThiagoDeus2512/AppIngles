<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' http://localhost:3000 https://api.mymemory.translated.net https://api.adviceslip.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:3000 https://api.mymemory.translated.net https://api.adviceslip.com;">
    
    <title>Life English ULTRA - 80/20 Pareto Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="header-status">
        <div id="timerDisplay">15</div>
        <div class="progress-container">
            <div id="progressBar"></div>
        </div>
        <div class="xp-label">
            XP <span id="xpDisplay">0</span>
        </div>
    </div>

    <div class="level-controls">
        <button class="level-btn active" id="btn-BEGINNER" onclick="setNivel('BEGINNER')">BEGINNER</button>
        <button class="level-btn" id="btn-INTERMEDIATE" onclick="setNivel('INTERMEDIATE')">INTERMEDIATE</button>
        <button class="level-btn" id="btn-ADVANCED" onclick="setNivel('ADVANCED')">ADVANCED</button>
    </div>

    <div class="container" id="mainContainer">
        <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 25px;">
            <span class="badge" id="tenseBadge">---</span>
            <span class="badge" id="typeBadge" style="background:#222; color: #888">---</span>
        </div>

        <div class="voice-wave" id="wave">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <div class="block-container" id="blockDisplay" onclick="falarAtual()"></div>

        <div id="pronunciationDisplay"></div>

        <div id="heardText"></div>

        <button class="btn-mic" onclick="testarPronuncia()">
            🎤 TESTAR PRONÚNCIA (SHADOWING)
        </button>

        <div class="input-wrapper" style="position: relative;">
            <input type="text" id="userInput" placeholder="Traduza e pressione Enter..." onkeypress="handleEnter(event)"
                autocomplete="off">
        </div>

        <button class="btn-next" onclick="proximaFrase()"
            style="margin-top: 20px; background: none; border: none; color: #555; cursor: pointer; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">
            PULAR ESTA FRASE ➡️
        </button>
    </div>

    <div class="admin-panel" style="background: var(--card); padding: 30px; border-radius: 20px; margin-top: 30px; width: 90%; max-width: 800px; border: 1px solid #252525;">
        
        <h3 style="margin:0 0 25px 0; font-size: 1rem; color: var(--primary); letter-spacing: 1.5px; font-weight: 900; text-align: center;">
            📊 DATA ANALYTICS (80/20 SYSTEM)
        </h3>

        <div class="stats-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
            <div class="stat-card" style="background: #000; padding: 15px; border-radius: 12px; text-align: center; border-top: 4px solid var(--pronoun)">
                <div style="font-size: 0.7rem; color: #555; font-weight: 800;">PRONOMES</div>
                <div id="count-pronouns" style="font-size: 1.5rem; font-weight: 900;">0</div>
            </div>
            <div class="stat-card" style="background: #000; padding: 15px; border-radius: 12px; text-align: center; border-top: 4px solid var(--verb)">
                <div style="font-size: 0.7rem; color: #555; font-weight: 800;">MOTORES</div>
                <div id="count-verbs" style="font-size: 1.5rem; font-weight: 900;">0</div>
            </div>
            <div class="stat-card" style="background: #000; padding: 15px; border-radius: 12px; text-align: center; border-top: 4px solid var(--adjective)">
                <div style="font-size: 0.7rem; color: #555; font-weight: 800;">ADJETIVOS</div>
                <div id="count-adjectives" style="font-size: 1.5rem; font-weight: 900;">0</div>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #222; margin: 35px 0;">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
            <button class="btn-api" onclick="gerarFraseViaAPI()"
                style="padding: 12px; background: #1a1a1a; color: white; border: 1px solid #333; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.7rem;">
                🎲 DICA ALEATÓRIA (EXTERNAL)
            </button>
            <button class="btn-api" onclick="sugerirFrasesIA()"
                style="padding: 12px; background: #34a853; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.7rem;">
                🤖 CONTEXTO IA (TEMÁTICO)
            </button>
        </div>

        <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap;">
            <span id="tag-PAST" class="badge">PASSADO</span>
            <span id="tag-PRESENT" class="badge">PRESENTE</span>
            <span id="tag-FUTURE" class="badge">FUTURO</span>
        </div>

        <input type="text" id="newEn" placeholder="Frase em inglês..." oninput="analisarDinamico()" style="margin-bottom: 10px;">

        <div id="translationPreview" style="font-size: 0.8rem; color: var(--primary); margin-bottom: 10px; text-align: center; font-weight: bold;">
            Aguardando entrada...
        </div>

        <input type="text" id="newPt" placeholder="Tradução em Português" style="margin-bottom: 10px;">
        <input type="text" id="manualSounds" placeholder="Pronúncia Sugerida (Ex: ai uana lêrn)">

        <select id="newLevel" style="width: 100%; padding: 15px; background: #000; color: #fff; border: 2px solid #333; border-radius: 16px; margin-top: 10px; font-weight: bold;">
            <option value="BEGINNER">Nível: Beginner</option>
            <option value="INTERMEDIATE">Nível: Intermediate</option>
            <option value="ADVANCED">Nível: Advanced</option>
        </select>

        <button class="btn-mic" style="background: var(--primary); margin-top: 25px;" onclick="saveNewPhrase()">
            SALVAR NO BANCO DE DADOS ☁️
        </button>
    </div>

    <div class="review-panel" id="reviewPanel"
        style="background: var(--card); padding: 20px; border-radius: 20px; margin-top: 20px; width: 90%; max-width: 800px; border: 1px solid #333; display: none;">
        <span style="color: var(--error); font-weight: 900; font-size: 0.85rem; display: flex; align-items: center; gap: 8px;">
            ⚠️ REVISÃO ATIVA (FALHAS RECENTES)
        </span>
        <div id="reviewList" style="margin-top: 15px; display: grid; gap: 10px;"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
